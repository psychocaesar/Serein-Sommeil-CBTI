<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Serein Sommeil</title>
  <!-- Serein Sommeil (octobre 2026) : le S de Serein, même fichier que l'icône Serein (tracé, dégradé, halo, lueur),
       en version nuit : S clair de lune sur fond nuit bleutée. Pistes explorées : design/logo/.
       Les classes bg / halo / fg servent au découpage de make-sources.mjs (éléments auto-fermants). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#132634"/>
      <stop offset="100%" stop-color="#060c14"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#8fb3c9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8fb3c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f1e6"/>
      <stop offset="50%" stop-color="#d9d3bd"/>
      <stop offset="100%" stop-color="#a9b8bd"/>
    </linearGradient>
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo-blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <rect class="bg" width="512" height="512" rx="108" fill="url(#bg)"/>
  <ellipse class="halo" cx="256" cy="210" rx="180" ry="160" fill="url(#halo)" filter="url(#halo-blur)"/>
  <path class="fg" d="M 308 158
       C 308 158 242 142 210 178
       C 178 214 206 240 244 252
       C 282 264 312 284 306 322
       C 300 358 228 370 196 362" fill="none" stroke="url(#stroke-grad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-soft)"/>
  <path class="fg" d="M 308 158
       C 308 158 242 142 210 178
       C 178 214 206 240 244 252
       C 282 264 312 284 306 322
       C 300 358 228 370 196 362" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <circle class="fg" cx="308" cy="158" r="7" fill="#f4f1e6" opacity="0.7"/>
  <circle class="fg" cx="196" cy="362" r="7" fill="#b9c6c9" opacity="0.5"/>
</svg>
