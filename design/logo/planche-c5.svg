<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<rect width="1600" height="900" fill="#f4f1ea"/>
<text x="60" y="80" font-family="Helvetica" font-size="40" font-weight="700" fill="#1d2a25">Serein Sommeil — piste C : la lune et son reflet</text>
<text x="60" y="120" font-family="Helvetica" font-size="22" fill="#5d7066">Deux croissants (arcs de cercle) qui se répondent forment le S : la nuit en haut, le matin en bas.</text>
<rect x="60" y="160" width="440" height="440" rx="24" fill="#fff"/>
<svg x="60" y="160" width="440" height="440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  
  <!-- C v5. Deux croissants : la lune et son reflet, pointes jointes -->
  <path d="M 318.0 154.0 A 72.2 72.2 0 1 0 248.0 258.0 A 63.4 63.4 0 0 1 318.0 154.0 Z" fill="#000"/><path d="M 186.0 370.0 A 72.2 72.2 0 1 0 256.0 266.0 A 63.4 63.4 0 0 1 186.0 370.0 Z" fill="#000"/>
</svg>

<text x="60" y="640" font-family="Helvetica" font-size="22" fill="#1d2a25">Noir</text>
<svg x="560" y="160" width="440" height="440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  
  <!-- C v5. Deux croissants couleur : lune clair, reflet vert -->
  <rect width="512" height="512" rx="108" fill="#0f241d"/><path d="M 318.0 154.0 A 72.2 72.2 0 1 0 248.0 258.0 A 63.4 63.4 0 0 1 318.0 154.0 Z" fill="#efe6d2"/><path d="M 186.0 370.0 A 72.2 72.2 0 1 0 256.0 266.0 A 63.4 63.4 0 0 1 186.0 370.0 Z" fill="#4db896"/>
</svg>

<text x="560" y="640" font-family="Helvetica" font-size="22" fill="#1d2a25">Lune clair, reflet vert (recommandé)</text>
<svg x="1060" y="160" width="440" height="440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  
  <!-- C v5. Fondu couleur : dégradé clair de lune → vert -->
  <rect width="512" height="512" rx="108" fill="#0f241d"/><defs><linearGradient id="p2-fondu" gradientUnits="userSpaceOnUse" x1="0" y1="190" x2="0" y2="300"><stop offset="0" stop-color="#efe6d2"/><stop offset="1" stop-color="#4db896"/></linearGradient></defs><path d="M 318.0 154.0 A 76.5 76.5 0 1 0 214.7 238.1 A 68.1 68.1 0 0 1 318.0 154.0 Z" fill="url(#p2-fondu)"/><g fill="none" stroke-linecap="round"><path d="M 202.1 226.0 C 210.3 237.5 226.0 246.3 244.0 252.0 C 282.0 264.0 312.0 284.0 306.0 322.0 C 300.0 358.0 228.0 370.0 196.0 362.0" stroke="url(#p2-fondu)" stroke-width="44"/></g>
</svg>

<text x="1060" y="640" font-family="Helvetica" font-size="22" fill="#1d2a25">Pour comparer : fondu en dégradé</text>
<rect x="60" y="680" width="1480" height="190" rx="24" fill="#3d566e"/>
<svg x="110" y="705" width="110" height="110" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="h0-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#132e26"/>
      <stop offset="100%" stop-color="#0a1a14"/>
    </radialGradient>
    <radialGradient id="h0-halo" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#2f6f5e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2f6f5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h0-stroke-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ee8be"/>
      <stop offset="50%" stop-color="#4db896"/>
      <stop offset="100%" stop-color="#2a8a68"/>
    </linearGradient>
    <filter id="h0-glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="h0-halo-blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Fond arrondi -->
  <rect width="512" height="512" rx="108" fill="url(#h0-bg)"/>

  <!-- Halo de profondeur -->
  <ellipse cx="256" cy="210" rx="180" ry="160" fill="url(#h0-halo)" filter="url(#h0-halo-blur)"/>

  <!-- S principal — trait épais avec dégradé -->
  <path
    d="M 308 158
       C 308 158 242 142 210 178
       C 178 214 206 240 244 252
       C 282 264 312 284 306 322
       C 300 358 228 370 196 362"
    fill="none"
    stroke="url(#h0-stroke-grad)"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#h0-glow-soft)"
  />

  <!-- S — filet lumineux par-dessus -->
  <path
    d="M 308 158
       C 308 158 242 142 210 178
       C 178 214 206 240 244 252
       C 282 264 312 284 306 322
       C 300 358 228 370 196 362"
    fill="none"
    stroke="#d4f5e2"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.55"
  />

  <!-- Petits points aux extrémités -->
  <circle cx="308" cy="158" r="7" fill="#7ee8be" opacity="0.7"/>
  <circle cx="196" cy="362" r="7" fill="#4db896" opacity="0.5"/>


</svg>

