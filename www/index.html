/* ============================ MODAL SYSTEM ============================ */
/* Registre de nettoyage : chaque modal peut enregistrer un callback exécuté à SA fermeture,
   quel que soit le chemin (bouton, tap sur le fond, bouton retour Android). */
let modalCleanups = [];
let modalDismissable = true;
function onModalClose(fn) { modalCleanups.push(fn); }
function openModal(contentNode, opts = {}) {
  closeModal();
  modalDismissable = opts.dismissable !== false;
  const back = el(`<div class="modal-backdrop"></div>`);
  const modal = el(`<div class="modal" role="dialog" aria-modal="true"></div>`);
  modal.appendChild(contentNode);
  back.appendChild(modal);
  back.onclick = e=>{ if(e.target===back && modalDismissable) closeModal(); };
  $("#modalRoot").appendChild(back);
  document.body.style.overflow="hidden";
}
function closeModal() {
  modalCleanups.forEach(fn => { try { fn(); } catch(e){} });
  modalCleanups = [];
  $("#modalRoot").querySelectorAll("audio").forEach(a=>a.pause());
  $("#modalRoot").innerHTML=""; document.body.style.overflow="";
}

/* ============================ EXPORT ============================ */
function exportJSON() {
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=`serein-sommeil-${ymd()}.json`;
  a.click(); URL.revokeObjectURL(url); toast("Données exportées");
}

/* =================================================================
   ACCUEIL (positionnement + garde-fous). Non fermable : on ne restreint
   pas le sommeil de quelqu'un sans avoir posé les questions de sécurité.
   ================================================================= */
function startOnboarding(redo = false) {
  const data = structuredClone(state.profile);
  if (!Array.isArray(data.screening)) data.screening = null;
  let step = 0;
  const STEPS = 5;
  let psyWindow = { has:null, bed:"" };

  function render() {
    const body = el(`<div></div>`);
    body.appendChild(el(`<div class="dots">${Array.from({length:STEPS},(_,i)=>`<span class="${i<=step?"on":""}"></span>`).join("")}</div>`));
    body.appendChild([stepWelcome, stepSommeil, stepSecurite, stepLever, stepDepart][step]());
    openModal(body, { dismissable: redo });
  }
  function nav(c, onNext, nextLabel = "Continuer →") {
    const next = el(`<button class="btn primary block mt">${nextLabel}</button>`); next.onclick = onNext; c.appendChild(next);
    if (step > 0) { const back = el(`<button class="btn ghost block mt">← Retour</button>`); back.onclick = () => { step--; render(); }; c.appendChild(back); }
  }

  function stepWelcome() {
    const c = el(`<div><div class="center" style="font-size:2.5rem" aria-hidden="true">🌙</div>
      <h2 class="center mt">Bienvenue</h2>
      <p class="mt">Serein Sommeil t'accompagne avec les outils de la <strong>TCC-I</strong> (thérapie cognitivo-comportementale de l'insomnie) : entre tes séances si tu es suivi·e, ou si tu pratiques en autonomie.</p>
      <p class="small muted mt">C'est un compagnon, pas un thérapeute. Il ne pose pas de diagnostic et ne remplace pas un avis médical. Si ton sommeil t'inquiète, parles-en à ton médecin.</p></div>`);
    nav(c, () => { step = 1; render(); }, "Commencer →");
    return c;
  }

  function stepSommeil() {
    const c = el(`<div><h2>Ton sommeil</h2></div>`);
    c.appendChild(el(`<div class="mt"></div>`));
    c.appendChild(choiceField("Depuis combien de temps tu dors mal ?", ["Moins de 3 mois","3 mois ou plus"], data.duration, v => data.duration = v));
    c.appendChild(choiceField("Ce qui te gêne le plus", ["M'endormir","Les réveils la nuit","Me réveiller trop tôt","Un sommeil peu reposant"], data.problem, v => data.problem = v, true));
    c.appendChild(choiceField("Es-tu suivi·e par un·e professionnel·le pour ton sommeil ?", ["Oui","Non"],
      data.accompanied == null ? null : (data.accompanied ? "Oui" : "Non"), v => data.accompanied = v === "Oui"));
    nav(c, () => {
      if (!data.duration || !data.problem || data.accompanied == null) { toast("Réponds aux trois questions"); return; }
      step = 2; render();
    });
    return c;
  }

  function stepSecurite() {
    const c = el(`<div><h2>Quelques questions de sécurité</h2>
      <p class="small muted mt">Certaines situations demandent qu'une fenêtre de sommeil resserrée soit décidée avec un·e professionnel·le. Est-ce que l'une d'elles te concerne ?</p></div>`);
    const sel = new Set(data.screening || []);
    let none = Array.isArray(data.screening) && data.screening.length === 0;
    const box = el(`<div class="choices col mt"></div>`);
    const btns = [];
    SCREEN_ITEMS.forEach(i => {
      const b = el(`<button type="button" aria-pressed="${sel.has(i.id)}">${esc(i.label)}</button>`);
      b.onclick = () => { if (sel.has(i.id)) sel.delete(i.id); else sel.add(i.id); none = false; sync(); };
      btns.push([b, i.id]); box.appendChild(b);
    });
    const noneBtn = el(`<button type="button" aria-pressed="${none}">Rien de tout ça</button>`);
    noneBtn.onclick = () => { none = !none; if (none) sel.clear(); sync(); };
    box.appendChild(noneBtn);
    function sync() { btns.forEach(([b,id]) => b.setAttribute("aria-pressed", sel.has(id))); noneBtn.setAttribute("aria-pressed", none); }
    c.appendChild(box);
    nav(c, () => {
      if (!sel.size && !none) { toast("Coche ce qui te concerne, ou « Rien de tout ça »"); return; }
      data.screening = [...sel]; step = 3; render();
    });
    return c;
  }

  function stepLever() {
    const c = el(`<div><h2>Ton heure de lever</h2>
      <p class="small muted mt">L'heure à laquelle tu te lèveras tous les jours, week-end compris. Choisis-la réaliste : c'est le point d'appui de tout le reste.</p></div>`);
    c.appendChild(el(`<div class="mt"></div>`));
    c.appendChild(timeField("Heure de lever", data.wakeAnchor, v => data.wakeAnchor = v));
    nav(c, () => { if (timeToMin(data.wakeAnchor) == null) { toast("Choisis une heure de lever"); return; } step = 4; render(); });
    return c;
  }

  function stepDepart() {
    const out = screeningOutcome(data);
    const c = el(`<div><h2>Pour commencer</h2></div>`);
    if (out.restriction === "pro") {
      c.appendChild(el(`<div class="card solid mt"><p class="small">Avec ce que tu as indiqué (${esc(out.reasons.join(", "))}), une fenêtre de sommeil resserrée se décide avec un·e professionnel·le : médecin, ou psy formé·e à la TCC-I.</p>
        <p class="small mt">L'app t'accompagne pour tout le reste : ton agenda du sommeil, ton heure de lever, les 5 règles et les outils.</p></div>`));
      if (out.recent) c.appendChild(el(`<p class="small muted mt">Des difficultés récentes s'arrangent souvent d'elles-mêmes. Si elles durent ou te pèsent, parles-en à ton médecin.</p>`));
    } else if (state.window) {
      c.appendChild(el(`<div class="card solid mt"><p class="small">Ta fenêtre actuelle (${state.window.bed} → ${state.window.wake}) est conservée. Tu peux la modifier dans « Ma fenêtre ».</p></div>`));
    } else if (data.accompanied) {
      c.appendChild(el(`<p class="small mt">Ton/ta psy t'a-t-il ou elle déjà donné une fenêtre de sommeil (une heure de coucher) ?</p>`));
      const bedField = timeField("Heure de coucher convenue", psyWindow.bed, v => psyWindow.bed = v);
      bedField.hidden = psyWindow.has !== true;
      c.appendChild(choiceField("", ["Oui","Pas encore"], psyWindow.has == null ? null : (psyWindow.has ? "Oui" : "Pas encore"),
        v => { psyWindow.has = v === "Oui"; bedField.hidden = !psyWindow.has; }));
      c.appendChild(bedField);
      c.appendChild(el(`<p class="small muted">Sinon, commence par une semaine d'observation : note tes nuits chaque matin, ce sera utile pour ta prochaine séance.</p>`));
    } else {
      c.appendChild(el(`<div class="card solid mt"><p class="small">Pendant 7 nuits, garde tes habitudes et note simplement tes nuits chaque matin. Ensuite, l'app te proposera une fenêtre de sommeil calculée à partir de ton propre sommeil.</p></div>`));
    }
    if (out.drowsy) c.appendChild(el(`<p class="small mt">⚠️ Tu as indiqué conduire beaucoup ou avoir un travail où la somnolence est dangereuse. Avec une fenêtre resserrée, la somnolence peut augmenter : sois particulièrement vigilant·e, et ne prends pas le volant si tu te sens somnolent·e.</p>`));
    c.appendChild(helpCard());
    nav(c, () => {
      if (!redo && !state.window && out.restriction !== "pro" && data.accompanied && psyWindow.has === true) {
        const err = validateWindow(psyWindow.bed, data.wakeAnchor, "psy");
        if (err) { toast(err, 3200); return; }
      }
      state.profile = data;
      state.profile.startDate = state.profile.startDate || ymd();
      if (state.window && state.window.wake !== data.wakeAnchor) state.window.wake = data.wakeAnchor;
      if (!state.window && out.restriction !== "pro" && data.accompanied && psyWindow.has === true)
        setWindow({ bed: psyWindow.bed, wake: data.wakeAnchor, setBy: "psy" });
      state.onboarded = true; save(); Notif.reschedule();
      closeModal(); navigate(redo ? "reglages" : "aujourdhui");
      toast(redo ? "C'est enregistré" : "Bienvenue. On avance à ton rythme.");
    }, redo ? "Enregistrer" : "C'est parti");
    return c;
  }

  render();
}

/* ============================ THEME ============================ */
function applyTheme() {
  document.documentElement.dataset.theme = state.theme;
  $('meta[name=theme-color]').setAttribute("content", state.theme==="dark"?"#0d1b15":"#f4f2ec");
}

/* ==== BOOT (les tests coupent le script ici) ==== */
function boot() {
  applyTheme();
  applyNightMode();
  setInterval(applyNightMode, 60000);
  $("#settingsBtn").onclick = () => navigate("reglages");
  $("#sosBtn").onclick = openSOS;
  navigate("aujourdhui");
  Notif.reschedule();
  if (!state.onboarded) startOnboarding();
}
boot();
</script>
