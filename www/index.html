<style>
/* Un display posé par une classe (.btn, .sos-fab…) l'emporte sur [hidden] du navigateur :
   cette règle rend l'attribut hidden fiable partout. Ne pas la retirer. */
[hidden] { display: none !important; }
/* ============================ TOKENS ============================ */
:root {
  --color-bg: #0d1b15;
  --color-surface: rgba(28,49,39,0.6);
  --color-surface-2: #1c3127;
  --color-primary: #93c9ac;
  --color-primary-2: #d8b78a;
  --color-primary-light: rgba(147,201,172,0.13);
  --color-text: #f0f4f0;
  --color-muted: #93a89b;
  --color-border: rgba(255,255,255,0.08);
  --color-danger: #e0917f;
  --radius: 1.625rem;
  --radius-sm: 0.9rem;
  --gradient: linear-gradient(120deg, #93c9ac, #d8b78a);
  --shadow: 0 8px 30px rgba(0,0,0,0.35);
  --font-title: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Hanken Grotesk', system-ui, sans-serif;
  --ease: cubic-bezier(.22,.61,.36,1);
}
html[data-theme="light"] {
  --color-bg: #f4f2ec;
  --color-surface: #ffffff;
  --color-surface-2: #f0ede4;
  --color-primary: #2f6b50;
  --color-primary-2: #c0883e;
  --color-primary-light: rgba(47,107,80,0.10);
  --color-text: #1b2a20;
  --color-muted: #5d7066;
  --color-border: rgba(0,0,0,0.09);
  --color-danger: #b9543d;
  --gradient: linear-gradient(120deg, #2f6b50, #c0883e);
  --shadow: 0 8px 30px rgba(0,0,0,0.10);
}
/* night mode overlay (21h-7h) - softens everything */
html[data-night="1"] {
  --color-bg: #060f0b;
  --color-text: #cdd8cf;
  --color-muted: #7e948a;
  --color-surface-2: #122019;
}
html[data-night="1"] body { font-size: 1.06rem; }

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font-body);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  transition: background .4s var(--ease), color .4s var(--ease);
  overscroll-behavior-y: contain;
}
h1,h2,h3,h4 { font-family: var(--font-title); font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; }
button { font-family: var(--font-body); cursor: pointer; border: none; background: none; color: inherit; font-size: 1rem; }
input, textarea, select { font-family: var(--font-body); color: var(--color-text); }
a { color: var(--color-primary); }

/* ============================ APP SHELL ============================ */
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  padding-top: env(safe-area-inset-top);
}
header.app-header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(0.9rem + env(safe-area-inset-top)) 1.25rem 0.9rem;
  background: linear-gradient(to bottom, var(--color-bg) 70%, transparent);
  backdrop-filter: blur(6px);
}
.app-header .brand { display:flex; align-items:center; gap:.55rem; }
.app-header .brand .logo {
  width: 30px; height: 30px; border-radius: 9px; background: var(--gradient);
  display:grid; place-items:center; font-size: 1rem;
}
.app-header .brand h1 { font-size: 1.15rem; }
.app-header .brand small { display:block; font-size:.62rem; color:var(--color-muted); font-family:var(--font-body); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; font-size: 1.2rem;
  background: var(--color-surface-2); color: var(--color-text);
  transition: transform .2s var(--ease), background .2s;
}
.icon-btn:active { transform: scale(.9); }

main {
  flex: 1;
  padding: 0.5rem 1.25rem 7rem;
  overflow-x: hidden;
}
.screen { animation: fadein .25s var(--ease); }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity:1; transform:none; } }

/* ============================ COMPONENTS ============================ */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: 1rem;
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow);
}
.card.solid { background: var(--color-surface-2); }
.card-title { font-size: 1.02rem; margin-bottom: .35rem; }
.muted { color: var(--color-muted); }
.small { font-size: .82rem; }
.tiny { font-size: .72rem; }
.center { text-align: center; }
.mb0 { margin-bottom: 0; }
.mt { margin-top: 1rem; }
.row { display:flex; gap:.6rem; }
.row.between { justify-content: space-between; align-items:center; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; }

.btn {
  display: inline-flex; align-items:center; justify-content:center; gap:.5rem;
  padding: .85rem 1.3rem; border-radius: 999px; font-weight: 700; font-size: .98rem;
  background: var(--color-surface-2); color: var(--color-text);
  transition: transform .15s var(--ease), opacity .2s, background .2s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--gradient); color: #0d1b15; }
.btn.block { display:flex; width: 100%; }
.btn.ghost { background: transparent; border: 1px solid var(--color-border); }
.btn.danger { background: var(--color-danger); color:#fff; }
.btn:disabled { opacity: .4; pointer-events: none; }

.pill {
  display:inline-flex; align-items:center; gap:.35rem;
  padding:.3rem .7rem; border-radius:999px; font-size:.74rem; font-weight:700;
  background: var(--color-primary-light); color: var(--color-primary);
}
.badge { font-size:.72rem; font-weight:700; padding:.25rem .6rem; border-radius:999px; }
.badge.good { background:rgba(147,201,172,.18); color:var(--color-primary); }
.badge.warn { background:rgba(216,183,138,.18); color:var(--color-primary-2); }
.badge.bad  { background:rgba(224,145,127,.18); color:var(--color-danger); }

.field { display:block; margin-bottom: 1rem; }
.field > span.lbl { display:block; font-weight:600; font-size:.9rem; margin-bottom:.45rem; }
.field .hint { font-weight:400; color: var(--color-muted); font-size:.78rem; }
input[type=time], input[type=text], input[type=number], input[type=date], textarea, select {
  width: 100%; background: var(--color-surface-2); border: 1px solid var(--color-border);
  border-radius: var(--radius-sm); padding: .8rem .9rem; font-size: 1rem; outline: none;
  transition: border-color .2s;
}
input:focus, textarea:focus, select:focus { border-color: var(--color-primary); }
textarea { resize: vertical; min-height: 70px; line-height:1.5; }

/* segmented choice */
.choices { display:flex; flex-wrap:wrap; gap:.5rem; }
.choices button {
  flex:1 1 auto; min-width: fit-content;
  padding:.65rem .9rem; border-radius:999px; font-size:.88rem; font-weight:600;
  background: var(--color-surface-2); border:1px solid var(--color-border); color:var(--color-text);
  transition: all .18s var(--ease);
}
.choices button[aria-pressed="true"] { background: var(--color-primary); color:#0d1b15; border-color:transparent; }

/* slider */
.slider-wrap { display:flex; align-items:center; gap:1rem; }
.slider-val { font-family:var(--font-title); font-size:1.4rem; min-width:4.2rem; text-align:right; color:var(--color-primary); }
input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:6px; background: var(--color-surface-2); outline:none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background: var(--gradient); border:3px solid var(--color-bg); cursor:pointer; }
input[type=range]::-moz-range-thumb { width:24px; height:24px; border-radius:50%; background: var(--color-primary); border:3px solid var(--color-bg); cursor:pointer; }

/* big metric */
.metric-big { font-family:var(--font-title); font-size:3rem; line-height:1; background:var(--gradient); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.metric-row { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
.metric-cell { background:var(--color-surface-2); border-radius:var(--radius-sm); padding:.9rem; }
.metric-cell .v { font-family:var(--font-title); font-size:1.5rem; }
.metric-cell .k { font-size:.72rem; color:var(--color-muted); }

/* ============================ BOTTOM NAV ============================ */
nav.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 60;
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--color-surface-2);
  border-top: 1px solid var(--color-border);
  padding: .4rem .3rem calc(.4rem + env(safe-area-inset-bottom));
  backdrop-filter: blur(12px);
}
nav.tabbar button {
  display:flex; flex-direction:column; align-items:center; gap:.15rem;
  padding:.45rem .2rem; border-radius: 14px; color: var(--color-muted); font-size:.62rem; font-weight:600;
  transition: color .2s, background .2s;
}
nav.tabbar button .ico { font-size:1.35rem; line-height:1; filter: grayscale(.4); transition: filter .2s, transform .2s; }
nav.tabbar button[aria-current="page"] { color: var(--color-primary); }
nav.tabbar button[aria-current="page"] .ico { filter:none; transform: translateY(-2px) scale(1.08); }

/* ============================ MODAL ============================ */
.modal-backdrop {
  position: fixed; inset:0; z-index:100; background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  display:flex; align-items:flex-end; justify-content:center; animation: fadein .2s;
}
.modal {
  background: var(--color-bg); width:100%; max-width:480px; border-radius: 28px 28px 0 0;
  padding: 1.6rem 1.4rem calc(1.6rem + env(safe-area-inset-bottom));
  max-height: 92vh; overflow-y:auto; box-shadow: var(--shadow);
  animation: slideup .35s var(--ease);
  border-top: 1px solid var(--color-border);
}
@keyframes slideup { from { transform: translateY(100%); } to { transform:none; } }
.modal h2 { font-size:1.3rem; margin-bottom:.6rem; }

/* progress dots */
.dots { display:flex; gap:.4rem; justify-content:center; margin: .5rem 0 1.2rem; }
.dots span { width:7px; height:7px; border-radius:50%; background:var(--color-border); transition: all .3s; }
.dots span.on { background: var(--color-primary); width:22px; border-radius:4px; }

/* rule cards */
.rule { display:flex; gap:.9rem; align-items:flex-start; background:var(--color-surface-2); border-radius:var(--radius-sm); padding:1rem; margin-bottom:.7rem; }
.rule .emoji { font-size:1.7rem; line-height:1; }
.rule strong { display:block; margin-bottom:.2rem; }

/* worry columns */
.worry-cols { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-top:.8rem; }
.worry-col { background:var(--color-surface-2); border-radius:var(--radius-sm); padding:.8rem; min-height:80px; }
.worry-col h4 { font-size:.85rem; margin-bottom:.5rem; }
.thought-chip { display:flex; align-items:center; gap:.5rem; background:var(--color-surface); border:1px solid var(--color-border); border-radius:12px; padding:.5rem .6rem; margin-bottom:.4rem; font-size:.84rem; }
.thought-chip .act { display:flex; gap:.3rem; margin-left:auto; }
.thought-chip .act button { width:28px; height:28px; border-radius:8px; background:var(--color-surface-2); font-size:.85rem; }
.thought-chip .act button.sel-a { background:var(--color-primary); color:#0d1b15; }
.thought-chip .act button.sel-b { background:var(--color-primary-2); color:#0d1b15; }

/* breathing */
.breath-stage { display:grid; place-items:center; height: 280px; position:relative; }
.breath-circle {
  width: 150px; height:150px; border-radius:50%;
  background: var(--gradient); opacity:.85;
  display:grid; place-items:center; color:#0d1b15; font-family:var(--font-title); font-weight:700; font-size:1.1rem; text-align:center;
  transition: transform 5s var(--ease), opacity .5s;
  box-shadow: 0 0 60px var(--color-primary-light);
}
.body-zone { font-family:var(--font-title); font-size:1.8rem; text-align:center; min-height:2.4rem; transition: opacity .4s; }

/* SOS float */
.sos-fab {
  position: fixed; right: max(1rem, calc(50% - 240px + 1rem)); bottom: calc(5.5rem + env(safe-area-inset-bottom)); z-index: 70;
  width:58px; height:58px; border-radius:50%; background: var(--gradient); color:#0d1b15;
  font-size:1.6rem; display:grid; place-items:center; box-shadow: 0 6px 24px rgba(0,0,0,.4);
  transition: transform .2s var(--ease);
}
.sos-fab:active { transform: scale(.9); }

/* checklist */
.check-item { display:flex; gap:.8rem; align-items:flex-start; padding:.85rem 0; border-bottom:1px solid var(--color-border); }
.check-item:last-child { border-bottom:none; }
.check-box { flex-shrink:0; width:26px; height:26px; border-radius:8px; border:2px solid var(--color-border); display:grid; place-items:center; margin-top:2px; transition: all .2s; font-size:.9rem; }
.check-item[data-done="1"] .check-box { background: var(--color-primary); border-color:transparent; color:#0d1b15; }
.check-item[data-done="1"] .ci-text { opacity:.55; text-decoration: line-through; }
.check-time { font-size:.72rem; color:var(--color-primary-2); font-weight:700; }

.empty { text-align:center; padding:2.5rem 1rem; color:var(--color-muted); }
.empty .big { font-size:2.5rem; margin-bottom:.5rem; }

.divider { height:1px; background:var(--color-border); margin:1.2rem 0; }
.toast {
  position: fixed; bottom: calc(6rem + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background: var(--color-text); color: var(--color-bg); padding:.7rem 1.2rem; border-radius:999px;
  font-weight:600; font-size:.88rem; z-index:120; box-shadow:var(--shadow); animation: fadein .2s;
  max-width: 90%; text-align:center;
}
.countdown { font-family:var(--font-title); font-size:2.6rem; background:var(--gradient); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }

.list-entry { background:var(--color-surface-2); border-radius:var(--radius-sm); padding:.85rem 1rem; margin-bottom:.6rem; }
.list-entry .date { font-size:.72rem; color:var(--color-muted); }

svg.chart { width:100%; height:auto; display:block; overflow:visible; }
.legend { display:flex; gap:1rem; flex-wrap:wrap; font-size:.72rem; color:var(--color-muted); margin-top:.4rem; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:.3rem; vertical-align:middle; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

/* sous-écrans (retour + titre) */
.subhead { display:flex; align-items:center; gap:.8rem; margin-bottom:1rem; }
.subhead h2 { font-size:1.25rem; }
.subhead .btn { padding:.55rem .9rem; font-size:.88rem; }
.link-btn { color:var(--color-primary); text-decoration:underline; font-size:.85rem; padding:.3rem 0; }
.choices.col button { flex:1 1 100%; text-align:left; border-radius:14px; }
.field-row { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
.quick { font-size:.75rem; color:var(--color-primary); font-weight:700; margin-left:.4rem; }
details.more { margin-bottom:1rem; }
details.more summary { cursor:pointer; font-weight:600; font-size:.9rem; color:var(--color-primary); padding:.4rem 0 .8rem; }
.night-row { cursor:pointer; }
.tool { display:flex; gap:.9rem; align-items:center; cursor:pointer; }
.tool .emoji { font-size:1.6rem; line-height:1; }
.tool .grow small { display:block; color:var(--color-muted); font-size:.8rem; margin-top:.15rem; }
.help-card a { color:var(--color-primary); font-weight:700; }
.sos-steps { padding-left:1.1rem; }
.sos-steps li { margin-bottom:.55rem; }

/* Respect de la préférence système "réduire les animations" (WCAG 2.3.3).
   Les guides de respiration deviennent des transitions instantanées : le rythme
   reste porté par les libellés (Inspire / Retiens / Expire). */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>

<script>
"use strict";
/* ===================================================================
   SEREIN SOMMEIL  (single-file PWA, vanilla JS)
   Compagnon des outils de la TCC-I (thérapie cognitivo-comportementale de
   l'insomnie), entre les séances ou en autonomie. Un compagnon, pas un
   thérapeute : l'app PROPOSE, la personne (et son/sa psy) DÉCIDE.
   Données 100 % locales · offline-first
   Références : contrôle du stimulus (Bootzin), restriction du sommeil
   (Spielman ; titration de Morin), agenda consensus (Carney 2012),
   « constructive worry » (Carney & Waters 2006), croyances (Morin, DBAS).
   =================================================================== */

/* ----------------------------- CONSTANTES ----------------------------- */
const APP_VERSION = "1.0.0"; // doit rester aligné avec package.json (vérifié par tests/versions.test.js)
const LS_KEY = "serein_cbti_v1";

/* Bornes de la fenêtre de sommeil. Plancher 5h30, plus prudent que les 5 h de Morin
   puisque l'app peut être utilisée sans professionnel. En dessous : seulement pour une
   fenêtre fixée avec un·e psy (4 h minimum, garde-fou contre une faute de saisie). */
const WINDOW_FLOOR_MIN = 330;
const WINDOW_FLOOR_PRO_MIN = 240;
const WINDOW_CAP_MIN = 540;
const WINDOW_STEP_MIN = 15;
const BASELINE_NIGHTS = 7;      // nuits d'observation avant de proposer une fenêtre
const REVIEW_MIN_NIGHTS = 5;    // nuits notées nécessaires pour un bilan
const REVIEW_EVERY_DAYS = 7;

const DEFAULT_STATE = {
  version: 2,
  onboarded: false,
  theme: "dark",
  profile: {
    duration: null,       // "Moins de 3 mois" | "3 mois ou plus"
    problem: null,
    accompanied: null,    // true = suivi·e par un·e professionnel·le pour son sommeil
    screening: null,      // ids de SCREEN_ITEMS cochés ([] = rien) ; null = pas encore répondu
    wakeAnchor: "07:00",  // heure de lever fixe
    startDate: null
  },
  window: null,           // { bed, wake, setBy: "psy"|"moi"|"agenda"|"bilan", since: "AAAA-MM-JJ" }
  windowLog: [],          // { date, kind: "set"|"adjust"|"keep", bed, wake, setBy, se, n, sleepy }
  journal: [],            // agenda consensus, une entrée par nuit datée du matin (cf. computeNight)
  worry: [],              // { date, items: [{ text, cat: "act"|"no", step }] }
  beliefs: [],            // { date, idx, before, after }
  worryTime: "18:00",
  reminders: { journal: false, worry: false, bedtime: false },
  nightModeAuto: true,
  healthSync: false       // synchro Apple Santé / Health Connect (pré-remplissage du journal uniquement)
};

/* ----------------------------- STATE ----------------------------- */
let state = load();

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    if (parsed.version !== 2) return migrateV1(parsed);
    return deepMerge(structuredClone(DEFAULT_STATE), parsed);
  } catch(e) { console.warn("load failed", e); return structuredClone(DEFAULT_STATE); }
}
function deepMerge(base, over) {
  for (const k in over) {
    if (over[k] && typeof over[k] === "object" && !Array.isArray(over[k]) && base[k] && typeof base[k] === "object" && !Array.isArray(base[k])) {
      deepMerge(base[k], over[k]);
    } else base[k] = over[k];
  }
  return base;
}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){ console.warn(e); } }

/* Migration depuis la v1 (fenêtre « prescrite », journal simplifié). Le journal et les
   réglages sont conservés ; l'accueil est refait car la v1 ne posait aucune question de
   sécurité avant de restreindre le sommeil. */
function migrateV1(old) {
  const s = structuredClone(DEFAULT_STATE);
  if (old.theme) s.theme = old.theme;
  if (typeof old.nightModeAuto === "boolean") s.nightModeAuto = old.nightModeAuto;
  if (old.reminders) s.reminders = { ...s.reminders, ...old.reminders };
  if (old.worryTime) s.worryTime = old.worryTime;
  if (typeof old.healthSync === "boolean") s.healthSync = old.healthSync;
  if (old.profile && old.profile.wakeAnchor) s.profile.wakeAnchor = old.profile.wakeAnchor;
  s.journal = (old.journal || []).filter(e => e && e.date && e.bed && e.wake).map(migrateNightV1);
  s.worry = (old.worry || []).map(w => ({
    date: String(w.date || "").slice(0, 10),
    items: (w.thoughts || []).map(t => ({ text: t.text, cat: t.cat, step: "" }))
  }));
  s.onboarded = false;
  return s;
}
function migrateNightV1(e) {
  const q = Number(e.quality);
  return {
    date: e.date, bed: e.bed, lightsOff: e.bed, sol: Number(e.latency) || 0,
    awakenings: e.awakenings === "4+" ? 4 : (Number(e.awakenings) || 0), waso: Number(e.awakeTime) || 0,
    finalWake: e.wake, rise: e.wake,
    quality: q ? Math.min(5, Math.max(1, Math.round(q / 2))) : null,
    nap: null, aid: "", alcohol: null, notes: e.notes || ""
  };
}

/* --------------------------- UTILITIES --------------------------- */
const $ = (s, r=document) => r.querySelector(s);
const el = (html) => { const t=document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = (s="") => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");

/* Dates : toujours en heure locale (AAAA-MM-JJ). Jamais toISOString(), qui est en UTC et
   décale d'un jour les saisies faites entre minuit et 2 h en France. */
function ymd(d = new Date()) { return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function parseYmd(s) { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d, 12); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
function frDate(s) { return parseYmd(s).toLocaleDateString("fr-FR", { weekday:"short", day:"numeric", month:"short" }); }

function timeToMin(t) { if (!t || !/^\d{1,2}:\d{2}/.test(t)) return null; const [h,m] = t.split(":").map(Number); return h*60 + m; }
function minToTime(m) { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m/60)) + ":" + pad(m % 60); }
/* minutes écoulées de `from` à `to`, en passant minuit si besoin (0 si identiques) */
function offsetMin(from, to) { const a = timeToMin(from), b = timeToMin(to); if (a == null || b == null) return null; return ((b - a) % 1440 + 1440) % 1440; }
/* écart signé de `t` par rapport à `ref`, ramené dans [-12 h, +12 h] */
function signedDiff(ref, t) { const d = offsetMin(ref, t); if (d == null) return null; return d > 720 ? d - 1440 : d; }
function fmtHM(min) {
  if (min == null) return "-"; const h = Math.floor(min/60), m = Math.round(min % 60);
  return m ? `${h}h${pad(m)}` : `${h}h`;
}
function roundUp15(m) { return Math.ceil(m / 15) * 15; }
function numOrNull(v) { return v === "" || v == null || isNaN(Number(v)) ? null : Number(v); }
function toast(msg, ms=2400) {
  const t = el(`<div class="toast" role="status">${esc(msg)}</div>`); document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),300); }, ms);
}

/* ---- Agenda du sommeil (Consensus Sleep Diary, Carney et al. 2012) ----
   Une nuit est datée du matin. Champs : bed (coucher), lightsOff (extinction = moment où
   on essaie de dormir), sol (endormissement, min), awakenings, waso (éveil nocturne, min),
   finalWake (dernier réveil), rise (lever), quality (1-5), et en option nap, aid, alcohol.
   Temps au lit = coucher → lever. Sommeil estimé = extinction → dernier réveil, moins
   l'endormissement et l'éveil nocturne. Le temps au lit après le dernier réveil compte
   donc bien comme du temps éveillé (réveil précoce). */
const QUALITY_LABELS = ["Très mauvaise", "Mauvaise", "Moyenne", "Bonne", "Très bonne"];

function computeNight(e) {
  const lo = offsetMin(e.bed, e.lightsOff), fw = offsetMin(e.bed, e.finalWake), tib = offsetMin(e.bed, e.rise);
  if (lo == null || fw == null || !tib) return { tib: null, tst: null, se: null };
  const tst = Math.max(0, fw - lo - (Number(e.sol) || 0) - (Number(e.waso) || 0));
  return { tib, tst, se: Math.round(tst / tib * 100) };
}

function validateNight(e) {
  if (!e.bed) return "Indique l'heure à laquelle tu t'es couché·e.";
  if (!e.lightsOff) return "Indique l'heure à laquelle tu as éteint pour dormir.";
  if (numOrNull(e.sol) == null) return "Estime le temps qu'il t'a fallu pour t'endormir.";
  if (e.awakenings == null) return "Indique combien de fois tu t'es réveillé·e.";
  if (e.awakenings > 0 && numOrNull(e.waso) == null) return "Estime le temps passé éveillé·e pendant la nuit.";
  if (!e.finalWake) return "Indique l'heure de ton dernier réveil.";
  if (!e.rise) return "Indique l'heure à laquelle tu t'es levé·e.";
  if (e.quality == null) return "Choisis la qualité de ta nuit.";
  const lo = offsetMin(e.bed, e.lightsOff), fw = offsetMin(e.bed, e.finalWake), r = offsetMin(e.bed, e.rise);
  if (!r || r > 16 * 60) return "Les heures de coucher et de lever ne semblent pas cohérentes.";
  if (lo > r) return "L'extinction doit se situer entre le coucher et le lever.";
  if (fw < lo || fw > r) return "Le dernier réveil doit se situer entre l'extinction et le lever.";
  if ((Number(e.sol) || 0) + (Number(e.waso) || 0) > fw - lo) return "L'endormissement et l'éveil nocturne dépassent la durée de la nuit : vérifie tes estimations.";
  return null;
}

/* ---- Garde-fous de la restriction du sommeil ----
   Contre-indications ou situations où la restriction ne se fait qu'avec un·e
   professionnel·le (Kyle et al. 2014 ; recommandations européennes 2023). La conduite
   n'est pas une contre-indication mais déclenche l'avertissement somnolence. */
const SCREEN_ITEMS = [
  { id:"bipolaire",  contra:true,  label:"Un trouble bipolaire", reason:"un trouble bipolaire" },
  { id:"epilepsie",  contra:true,  label:"Une épilepsie", reason:"une épilepsie" },
  { id:"apnee",      contra:true,  label:"De forts ronflements, des pauses respiratoires remarquées par quelqu'un, ou une apnée du sommeil", reason:"des signes possibles d'apnée du sommeil" },
  { id:"parasomnie", contra:true,  label:"Des comportements inhabituels pendant le sommeil (somnambulisme, gestes brusques, cris)", reason:"des comportements inhabituels pendant le sommeil" },
  { id:"jambes",     contra:true,  label:"Un besoin irrépressible de bouger les jambes le soir", reason:"des signes possibles de jambes sans repos" },
  { id:"horaires",   contra:true,  label:"Un travail de nuit ou en horaires alternants", reason:"des horaires de travail décalés" },
  { id:"grossesse",  contra:true,  label:"Une grossesse en cours", reason:"une grossesse" },
  { id:"conduite",   contra:false, label:"Tu conduis beaucoup, ou ton travail rend la somnolence dangereuse", reason:"" },
];

function screeningOutcome(profile) {
  if (!profile || !Array.isArray(profile.screening))
    return { restriction:"pro", reasons:["le questionnaire de départ n'est pas rempli"], drowsy:false, recent:false };
  const ids = profile.screening;
  const reasons = SCREEN_ITEMS.filter(i => i.contra && ids.includes(i.id)).map(i => i.reason);
  const recent = profile.duration === "Moins de 3 mois";
  if (recent) reasons.unshift("des difficultés de sommeil depuis moins de 3 mois");
  return { restriction: reasons.length ? "pro" : "ok", reasons, drowsy: ids.includes("conduite"), recent };
}

/* ---- Fenêtre de départ, après la semaine d'observation ----
   Temps au lit = sommeil moyen estimé (arrondi au quart d'heure supérieur), borné
   [5h30, 9h]. Le lever reste l'heure fixe choisie ; le coucher en découle. */
function baselineSuggestion(journal, wakeAnchor, today) {
  const nights = journal
    .filter(e => e.date > addDays(today, -14) && e.date <= today)
    .map(computeNight).filter(c => c.tst != null);
  const n = nights.length;
  if (n < BASELINE_NIGHTS) return { ready:false, n, needed:BASELINE_NIGHTS };
  const meanTst = Math.round(nights.reduce((s,c) => s + c.tst, 0) / n);
  const meanTib = Math.round(nights.reduce((s,c) => s + c.tib, 0) / n);
  const tib = Math.min(WINDOW_CAP_MIN, Math.max(WINDOW_FLOOR_MIN, roundUp15(meanTst)));
  return { ready:true, n, meanTst, meanTib, tib, bed: minToTime(timeToMin(wakeAnchor) - tib), wake: wakeAnchor, restricts: tib < meanTib };
}

/* ---- Bilan hebdomadaire ---- */
function lastDecisionDate(s) {
  return s.windowLog.length ? s.windowLog[s.windowLog.length - 1].date : (s.window && s.window.since);
}
function reviewInfo(s, today) {
  if (!s.window) return null;
  const last = lastDecisionDate(s) || today;
  const nights = s.journal.filter(e => e.date > last && e.date <= today).slice(-7);
  const days = daysBetween(last, today);
  return { last, days, nights, due: days >= REVIEW_EVERY_DAYS && nights.length >= REVIEW_MIN_NIGHTS, inDays: Math.max(0, REVIEW_EVERY_DAYS - days) };
}

/* Titration de Morin : efficacité ≥ 85 % → +15 min ; 80-84 % → on garde ; < 80 % → -15 min.
   Jamais sous le plancher, jamais au-dessus de 9 h. Somnolence signalée → on ne resserre
   jamais, et on élargit si l'efficacité est correcte (≥ 80 %). C'est une PROPOSITION :
   rien ne change sans validation. */
function suggestAdjustment(nights, win, opts = {}) {
  const vals = nights.map(computeNight).filter(c => c.se != null);
  const n = vals.length;
  const tib = offsetMin(win.bed, win.wake);
  if (n < REVIEW_MIN_NIGHTS) return { status:"insufficient", n, tib };
  const meanSE = Math.round(vals.reduce((s,c) => s + c.se, 0) / n);
  let status = meanSE >= 85 ? "up" : meanSE >= 80 ? "keep" : "down";
  if (opts.sleepy) { if (status === "down") status = "keep"; else if (status === "keep") status = "up"; }
  if (status === "up" && tib + WINDOW_STEP_MIN > WINDOW_CAP_MIN) status = "cap";
  if (status === "down" && tib - WINDOW_STEP_MIN < WINDOW_FLOOR_MIN) status = "floor";
  const newTib = status === "up" ? tib + WINDOW_STEP_MIN : status === "down" ? tib - WINDOW_STEP_MIN : tib;
  return { status, n, meanSE, tib, newTib, newBed: minToTime(timeToMin(win.wake) - newTib), wake: win.wake, sleepy: !!opts.sleepy };
}

/* Respect de la fenêtre, recalculé depuis l'agenda (pas besoin de le demander) :
   extinction pas plus de 15 min avant l'heure de coucher, lever à ±30 min. */
function adherence(nights, win) {
  let bedOk = 0, riseOk = 0;
  nights.forEach(e => {
    const d1 = signedDiff(win.bed, e.lightsOff); if (d1 != null && d1 >= -15) bedOk++;
    const d2 = signedDiff(win.wake, e.rise); if (d2 != null && Math.abs(d2) <= 30) riseOk++;
  });
  return { n: nights.length, bedOk, riseOk };
}

/* Fenêtre saisie à la main : bornes selon qui l'a décidée */
function validateWindow(bed, wake, setBy) {
  const tib = offsetMin(bed, wake);
  if (tib == null) return "Indique une heure de coucher et une heure de lever.";
  const floor = setBy === "psy" ? WINDOW_FLOOR_PRO_MIN : WINDOW_FLOOR_MIN;
  if (tib < floor) return setBy === "psy"
    ? "Une fenêtre de moins de 4 h semble être une erreur de saisie."
    : "En dessous de 5h30 au lit, une fenêtre se décide seulement avec un·e professionnel·le.";
  if (tib > 600) return "Une fenêtre de plus de 10 h semble être une erreur de saisie.";
  return null;
}

/* Récap texte de l'agenda, à partager avec son/sa psy */
function agendaText(journal, win, today, days = 14) {
  const from = addDays(today, -days);
  const nights = journal.filter(e => e.date > from && e.date <= today);
  const lines = ["Mon agenda du sommeil (Serein Sommeil)"];
  if (win) lines.push(`Fenêtre actuelle : ${win.bed} → ${win.wake} (${fmtHM(offsetMin(win.bed, win.wake))} au lit)`);
  lines.push("");
  if (!nights.length) { lines.push("Aucune nuit notée sur cette période."); return lines.join("\n"); }
  nights.forEach(e => {
    const c = computeNight(e);
    lines.push(`${frDate(e.date)} : couché·e ${e.bed}, extinction ${e.lightsOff}, endormissement ~${e.sol} min, ` +
      `${e.awakenings} réveil(s)${e.awakenings ? ` (~${e.waso} min)` : ""}, dernier réveil ${e.finalWake}, levé·e ${e.rise}, ` +
      `qualité ${e.quality}/5 - sommeil ~${fmtHM(c.tst)} sur ${fmtHM(c.tib)} au lit (${c.se} %)`);
    const extra = [];
    if (e.nap) extra.push(`sieste ${e.nap} min`);
    if (e.aid) extra.push(`aide au sommeil : ${e.aid}`);
    if (e.alcohol) extra.push(`alcool : ${e.alcohol} verre(s)`);
    if (e.notes) extra.push(`note : ${e.notes}`);
    if (extra.length) lines.push("   " + extra.join(" · "));
  });
  const cs = nights.map(computeNight);
  const mean = k => Math.round(cs.reduce((s,c) => s + c[k], 0) / cs.length);
  lines.push("", `Moyenne sur ${cs.length} nuit(s) : sommeil ~${fmtHM(mean("tst"))}, au lit ${fmtHM(mean("tib"))}, efficacité ${mean("se")} %`);
  return lines.join("\n");
}

/* En natif → plugin LocalNotifications (planification quotidienne fiable, app fermée).
   Sur le web / file:// → repli "best effort" via setTimeout tant que l'app est ouverte. */
const Cap = () => (typeof window !== "undefined" && window.Capacitor) || null;
const isNative = () => { const c = Cap(); return !!(c && c.isNativePlatform && c.isNativePlatform()); };
const LN = () => { const c = Cap(); return c && c.Plugins && c.Plugins.LocalNotifications; };

const NOTIF_DEFS = [
  { key:"journal", id:101, time:()=> minToTime(timeToMin(state.profile.wakeAnchor) + 30), title:"Serein Sommeil", body:"Ta nuit en quelques secondes, de mémoire, quand tu veux ce matin." },
  { key:"worry",   id:102, time:()=> state.worryTime, title:"Le moment des soucis", body:"15 minutes pour poser ce qui te préoccupe, loin du lit." },
  { key:"bedtime", id:103, time:()=> state.window ? minToTime(timeToMin(state.window.bed) - 30) : null, title:"Ta fenêtre de sommeil", body:"Elle commence dans 30 min. Au lit seulement si tu as sommeil." },
];

const Notif = {
  timers: [],
  async ensure() {
    if (isNative() && LN()) { try { const r = await LN().requestPermissions(); return r.display === "granted"; } catch(e){ return false; } }
    if (!("Notification" in window)) return false;
    if (Notification.permission === "granted") return true;
    if (Notification.permission === "denied") return false;
    return (await Notification.requestPermission()) === "granted";
  },
  fire(title, body) {
    if (isNative() && LN()) { try { LN().schedule({ notifications:[{ id: 200000 + (Date.now()%90000), title, body }] }); } catch(e){} return; }
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    try { new Notification(title, { body }); } catch(e){}
  },
  active() { return NOTIF_DEFS.filter(d => state.reminders[d.key] && timeToMin(d.time()) != null); },
  async reschedule() {
    if (isNative() && LN()) {
      try {
        const pending = await LN().getPending();
        if (pending && pending.notifications && pending.notifications.length)
          await LN().cancel({ notifications: pending.notifications.map(n=>({ id:n.id })) });
        const notifs = this.active().map(d=>{
          const m = timeToMin(d.time());
          return { id:d.id, title:d.title, body:d.body,
                   schedule:{ on:{ hour:Math.floor(m/60), minute:m%60 }, repeats:true, allowWhileIdle:true } };
        });
        if (notifs.length) await LN().schedule({ notifications: notifs });
      } catch(e){ console.warn("native notif", e); }
      return;
    }
    this.timers.forEach(clearTimeout); this.timers = [];
    const now = new Date();
    this.active().forEach(d=>{
      const m = timeToMin(d.time());
      const target = new Date(); target.setHours(Math.floor(m/60), m%60, 0, 0);
      if (target <= now) return;
      this.timers.push(setTimeout(()=>this.fire(d.title, d.body), target - now));
    });
  }
};

/* ===================== SYNCHRO SANTÉ (Apple Santé / Health Connect) ===================== */
/* Pré-remplit l'heure de coucher et de dernier réveil depuis le capteur (montre, téléphone).
   Ne touche JAMAIS aux champs subjectifs (endormissement, éveil, qualité) : la TCC-I
   travaille la perception du sommeil, pas sa mesure. Via @capgo/capacitor-health. */
const HealthPlugin = () => { const c = Cap(); return c && c.Plugins && c.Plugins.Health; };
const HealthSync = {
  available() { return isNative() && !!HealthPlugin(); },
  async ensure() {
    if (!this.available()) return false;
    try {
      const p = HealthPlugin();
      if (p.isAvailable) { const r = await p.isAvailable(); if (r && r.available === false) return false; }
      const auth = await p.requestAuthorization({ read: ["sleep"] });
      return !(auth.readDenied && auth.readDenied.includes("sleep"));
    } catch(e) { console.warn("health auth", e); return false; }
  },
  async fetchLastNight() {
    if (!this.available()) return null;
    try {
      const p = HealthPlugin();
      const end = new Date(), start = new Date(Date.now() - 32*3600*1000);
      const { samples } = await p.readSamples({ dataType:"sleep", startDate:start.toISOString(), endDate:end.toISOString(), limit:200, ascending:true });
      if (!samples || !samples.length) return null;
      const relevant = samples.filter(s => ["inBed","asleep","rem","deep","light"].includes(s.sleepState));
      if (!relevant.length) return null;
      const starts = relevant.map(s => new Date(s.startDate).getTime());
      const ends = relevant.map(s => new Date(s.endDate).getTime());
      const bedDate = new Date(Math.min(...starts)), wakeDate = new Date(Math.max(...ends));
      const spanH = (wakeDate - bedDate) / 3600000;
      if (spanH < 2 || spanH > 14) return null;
      return { bed: pad(bedDate.getHours())+":"+pad(bedDate.getMinutes()), wake: pad(wakeDate.getHours())+":"+pad(wakeDate.getMinutes()) };
    } catch(e) { console.warn("health fetch", e); return null; }
  }
};

/* ============================ ROUTER ============================ */
/* 3 onglets + des sous-écrans (avec bouton retour) + SOS nuit en bouton flottant. */
const TABS = [
  { id:"aujourdhui", icon:"🌅", label:"Aujourd'hui", render: () => renderAujourdhui() },
  { id:"fenetre",    icon:"🛏️", label:"Ma fenêtre",  render: () => renderFenetre() },
  { id:"outils",     icon:"🧰", label:"Outils",      render: () => renderOutils() },
];
const SUBSCREENS = {
  nuit:       { parent:null,     render: () => renderNuit(navParam) },
  reglages:   { parent:null,     render: () => renderReglages() },
  regles:     { parent:"outils", render: () => renderRegles() },
  soucis:     { parent:"outils", render: () => renderSoucis() },
  croyances:  { parent:"outils", render: () => renderCroyances() },
  detente:    { parent:"outils", render: () => renderDetente() },
  transition: { parent:"outils", render: () => renderTransition() },
};
let currentScreen = "aujourdhui", lastTab = "aujourdhui", navParam = null;

function activeTab() { return SUBSCREENS[currentScreen] ? (SUBSCREENS[currentScreen].parent || lastTab) : currentScreen; }

function navigate(id, param = null, fromPop = false) {
  currentScreen = id; navParam = param;
  if (!SUBSCREENS[id]) lastTab = id;
  // historique navigateur : donne un comportement correct au bouton retour Android
  if (!fromPop) {
    const st = { screen:id, param };
    if (!history.state) history.replaceState(st, "");
    else if (history.state.screen !== id || history.state.param !== param) history.pushState(st, "");
  }
  renderTabs();
  const view = $("#view");
  view.innerHTML = "";
  const node = SUBSCREENS[id] ? SUBSCREENS[id].render() : TABS.find(t=>t.id===id).render();
  node.classList.add("screen");
  view.appendChild(node);
  window.scrollTo(0,0);
}
function goBack() {
  if (history.state && history.length > 1) history.back();
  else navigate(SUBSCREENS[currentScreen] ? (SUBSCREENS[currentScreen].parent || lastTab) : "aujourdhui");
}
function rerender() { navigate(currentScreen, navParam, true); }

// Bouton retour (Android) / history back : ferme d'abord le modal ouvert, sinon remonte l'historique
window.addEventListener("popstate", e => {
  if ($("#modalRoot").children.length) {
    if (modalDismissable) closeModal();
    history.pushState({ screen: currentScreen, param: navParam }, "");
    return;
  }
  if (e.state && e.state.screen) navigate(e.state.screen, e.state.param, true);
});
function renderTabs() {
  const bar = $("#tabbar");
  bar.innerHTML = "";
  const act = activeTab();
  TABS.forEach(t => {
    const b = el(`<button aria-current="${t.id===act ? "page" : "false"}">
      <span class="ico" aria-hidden="true">${t.icon}</span><span>${t.label}</span></button>`);
    b.onclick = () => navigate(t.id);
    bar.appendChild(b);
  });
}
function subhead(title) {
  const h = el(`<div class="subhead"><button class="btn ghost">← Retour</button><h2>${esc(title)}</h2></div>`);
  h.querySelector("button").onclick = goBack;
  return h;
}

/* =================================================================
   NOTER UNE NUIT (agenda consensus)
   ================================================================= */
function renderNuit(dateParam) {
  const today = ymd();
  const minDate = addDays(today, -13);
  const date = dateParam && dateParam >= minDate && dateParam <= today ? dateParam : today;
  const wrap = el(`<div></div>`);
  wrap.appendChild(subhead("Noter une nuit"));
  const picker = el(`<div class="card"><label class="field mb0"><span class="lbl">Nuit à noter <span class="hint">(datée du matin au réveil)</span></span>
    <input type="date" value="${date}" min="${minDate}" max="${today}"></label></div>`);
  picker.querySelector("input").onchange = e => {
    const d = e.target.value;
    navigate("nuit", d && d >= minDate && d <= today ? d : today, true);
    history.replaceState({ screen:"nuit", param: navParam }, "");
  };
  wrap.appendChild(picker);
  wrap.appendChild(buildNightForm(date));
  return wrap;
}

function buildNightForm(date) {
  const ex = state.journal.find(e => e.date === date) || {};
  // Aucune valeur par défaut sur ce qui est une estimation : la personne remplit elle-même.
  const f = {
    bed: ex.bed || "", lightsOff: ex.lightsOff || "", sol: ex.sol ?? "", awakenings: ex.awakenings ?? null,
    waso: ex.waso ?? "", finalWake: ex.finalWake || "", rise: ex.rise || "", quality: ex.quality ?? null,
    nap: ex.nap ?? "", aid: ex.aid || "", alcohol: ex.alcohol ?? "", notes: ex.notes || ""
  };
  const card = el(`<div class="card"></div>`);
  card.appendChild(el(`<h2>${date === ymd() ? "Ta nuit dernière" : "Nuit du " + frDate(date)}</h2>`));
  card.appendChild(el(`<p class="small muted mt" style="margin-bottom:1rem">Tes estimations du matin suffisent : pas besoin d'être précis·e à la minute.</p>`));

  const bed = timeField("Heure à laquelle tu t'es couché·e", f.bed, v => f.bed = v);
  const lightsOff = timeField("Heure à laquelle tu as éteint pour dormir", f.lightsOff, v => f.lightsOff = v, "Pareil", () => f.bed);
  const finalWake = timeField("Heure de ton dernier réveil", f.finalWake, v => f.finalWake = v);
  const rise = timeField("Heure à laquelle tu t'es levé·e", f.rise, v => f.rise = v, "Pareil", () => f.finalWake);

  if (HealthSync.available() && state.healthSync && date === ymd()) {
    const syncBtn = el(`<button type="button" class="btn ghost block">🔄 Récupérer depuis Apple Santé / Health Connect</button>`);
    const syncLabel = syncBtn.textContent;
    syncBtn.onclick = async ()=>{
      syncBtn.disabled = true; syncBtn.textContent = "Récupération…";
      const data = await HealthSync.fetchLastNight();
      syncBtn.disabled = false; syncBtn.textContent = syncLabel;
      if (!data) { toast("Aucune donnée de sommeil trouvée pour cette nuit"); return; }
      f.bed = data.bed; f.finalWake = data.wake;
      bed.querySelector("input").value = data.bed;
      finalWake.querySelector("input").value = data.wake;
      updatePreview();
      toast("Coucher et dernier réveil pré-remplis : vérifie et ajuste si besoin");
    };
    card.appendChild(syncBtn);
    card.appendChild(el(`<p class="tiny muted mt" style="margin-bottom:1rem">Pré-remplit seulement le coucher et le dernier réveil. Le reste, c'est ton estimation.</p>`));
  }

  card.appendChild(bed);
  card.appendChild(lightsOff);
  card.appendChild(numberField("Temps pour t'endormir, à peu près", f.sol, "minutes", v => f.sol = v));
  const wasoField = numberField("Temps éveillé·e au total pendant la nuit, à peu près", f.waso, "minutes", v => f.waso = v);
  const awk = choiceField("Combien de fois t'es-tu réveillé·e ?", ["0","1","2","3","4","5+"],
    f.awakenings == null ? null : (f.awakenings >= 5 ? "5+" : String(f.awakenings)),
    v => { f.awakenings = v === "5+" ? 5 : Number(v); syncWaso(); });
  card.appendChild(awk);
  card.appendChild(wasoField);
  const syncWaso = () => { const none = f.awakenings === 0; wasoField.hidden = none; f.waso = none ? 0 : wasoField.querySelector("input").value; };
  syncWaso();
  card.appendChild(finalWake);
  card.appendChild(rise);
  card.appendChild(choiceField("Qualité de ta nuit", QUALITY_LABELS, f.quality ? QUALITY_LABELS[f.quality-1] : null, v => f.quality = QUALITY_LABELS.indexOf(v) + 1));

  const more = el(`<details class="more"${(f.nap || f.aid || f.alcohol || f.notes) ? " open" : ""}><summary>Plus de détails (facultatif)</summary></details>`);
  more.appendChild(numberField("Sieste ou assoupissement hier", f.nap, "minutes", v => f.nap = v));
  const aid = el(`<label class="field"><span class="lbl">Médicament ou aide pour dormir <span class="hint">(lequel, quelle dose)</span></span><input type="text" maxlength="80" value="${esc(f.aid)}"></label>`);
  aid.querySelector("input").oninput = e => f.aid = e.target.value;
  more.appendChild(aid);
  more.appendChild(numberField("Alcool hier soir", f.alcohol, "verres", v => f.alcohol = v));
  const notes = el(`<label class="field"><span class="lbl">Notes <span class="hint">(200 caractères)</span></span><textarea maxlength="200">${esc(f.notes)}</textarea></label>`);
  notes.querySelector("textarea").oninput = e => f.notes = e.target.value;
  more.appendChild(notes);
  card.appendChild(more);

  // aperçu neutre : des durées, pas de jugement
  const preview = el(`<div class="card solid center mb0"><p class="small" aria-live="polite">-</p></div>`);
  card.appendChild(preview);
  const updatePreview = () => {
    const c = computeNight(f);
    preview.firstElementChild.textContent = c.tib && !validateNight(f)
      ? `Au lit ${fmtHM(c.tib)} · sommeil estimé ${fmtHM(c.tst)}`
      : "L'estimation apparaîtra une fois tout rempli.";
  };
  card.addEventListener("input", updatePreview);
  card.addEventListener("click", () => setTimeout(updatePreview, 0));
  setTimeout(updatePreview, 0);

  const submit = el(`<button class="btn primary block mt">Enregistrer</button>`);
  submit.onclick = () => {
    const err = validateNight(f);
    if (err) { toast(err, 3200); return; }
    const entry = {
      date, bed: f.bed, lightsOff: f.lightsOff, sol: Number(f.sol), awakenings: f.awakenings,
      waso: f.awakenings === 0 ? 0 : Number(f.waso), finalWake: f.finalWake, rise: f.rise, quality: f.quality,
      nap: numOrNull(f.nap), aid: f.aid.trim(), alcohol: numOrNull(f.alcohol), notes: f.notes.trim()
    };
    const idx = state.journal.findIndex(e => e.date === date);
    if (idx >= 0) state.journal[idx] = entry; else state.journal.push(entry);
    state.journal.sort((a,b) => a.date.localeCompare(b.date));
    save();
    toast("Nuit notée");
    goBack();
  };
  card.appendChild(submit);
  return card;
}

/* field builders */
function timeField(label, val, onChange, quickLabel, quickValue) {
  const f = el(`<label class="field"><span class="lbl">${esc(label)}${quickLabel ? ` <button type="button" class="quick">${esc(quickLabel)}</button>` : ""}</span><input type="time" value="${esc(val)}"></label>`);
  const inp = f.querySelector("input");
  inp.onchange = e => onChange(e.target.value);
  inp.oninput = e => onChange(e.target.value);
  if (quickLabel) f.querySelector(".quick").onclick = ev => {
    ev.preventDefault();
    const v = quickValue(); if (!v) return;
    inp.value = v; onChange(v); inp.dispatchEvent(new Event("input", { bubbles:true }));
  };
  return f;
}
function numberField(label, val, unit, onChange) {
  const f = el(`<label class="field"><span class="lbl">${esc(label)} <span class="hint">(${esc(unit)})</span></span><input type="number" inputmode="numeric" min="0" max="900" step="1" value="${esc(val)}"></label>`);
  f.querySelector("input").oninput = e => onChange(e.target.value);
  return f;
}
function choiceField(label, opts, val, onChange, col) {
  const f = el(`<div class="field" role="group"><span class="lbl">${esc(label)}</span><div class="choices${col ? " col" : ""}"></div></div>`);
  const box = f.querySelector(".choices");
  opts.forEach(o=>{
    const b = el(`<button type="button" aria-pressed="${o===val}">${esc(o)}</button>`);
    b.onclick = ()=>{ box.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); onChange(o); };
    box.appendChild(b);
  });
  return f;
}

}

function setWindow({ bed, wake, setBy }, kind = "set", extra = {}) {
  const today = ymd();
  state.window = { bed, wake, setBy, since: today };
  state.profile.wakeAnchor = wake;
  state.windowLog.push({ date: today, kind, bed, wake, setBy, ...extra });
  if (state.windowLog.length > 60) state.windowLog = state.windowLog.slice(-60);
  save(); Notif.reschedule();
}

function buildReviewCard(today, out) {
  const info = reviewInfo(state, today);
  if (!info.due) {
    const missing = Math.max(0, REVIEW_MIN_NIGHTS - info.nights.length);
    const txt = info.inDays > 0
      ? `Prochain bilan dans ${info.inDays} jour(s).`
      : `Ton bilan sera prêt quand ${missing} nuit(s) de plus seront notées.`;
    return el(`<div class="card"><div class="card-title">Bilan de la semaine</div><p class="small muted">${txt} Il faut au moins ${REVIEW_MIN_NIGHTS} nuits notées depuis le dernier point.</p></div>`);
  }
  const w = state.window;
  const adh = adherence(info.nights, w);
  const c = el(`<div class="card" style="border-left:4px solid var(--color-primary)">
    <div class="card-title">Bilan de la semaine</div>
    <p class="small mt">${info.nights.length} nuits notées depuis le dernier point, le ${frDate(info.last)}</p>
    <ul class="small muted mt" style="padding-left:1.1rem">
      <li>Coucher pas avant ${w.bed} : ${adh.bedOk} nuit(s) sur ${adh.n}</li>
      <li>Lever autour de ${w.wake} : ${adh.riseOk} nuit(s) sur ${adh.n}</li>
    </ul></div>`);
  const result = el(`<div></div>`);
  c.appendChild(choiceField("Cette semaine, t'est-il arrivé de piquer du nez en journée (en lisant, devant un écran, au volant) ?", ["Oui","Non"], null, v => showSuggestion(v === "Oui")));
  c.appendChild(result);

  function showSuggestion(sleepy) {
    const s = suggestAdjustment(info.nights, w, { sleepy });
    result.innerHTML = "";
    const pct = `environ ${s.meanSE} % du temps passé au lit`;
    const TEXT = {
      up: sleepy && s.meanSE < 85
        ? `Comme tu as été somnolent·e, mieux vaut élargir ta fenêtre de 15 minutes : coucher à ${s.newBed}.`
        : `Ton sommeil occupe bien ta fenêtre (${pct}). Tu peux l'élargir de 15 minutes : coucher à ${s.newBed}.`,
      keep: sleepy
        ? `Tu as été somnolent·e : on ne resserre pas. On garde ta fenêtre, et si la somnolence continue, parles-en avec ton/ta psy ou ton médecin.`
        : `Ton sommeil a occupé ${pct}. On garde ta fenêtre telle quelle cette semaine.`,
      down: `Il reste pas mal de temps éveillé au lit (sommeil sur ${pct}). Resserrer de 15 minutes peut aider le sommeil à se regrouper : coucher à ${s.newBed}.`,
      floor: `Ta fenêtre est déjà à ${fmtHM(s.tib)}, le minimum que l'app propose. On la garde ; si les choses ne bougent pas, parles-en avec ton/ta psy.`,
      cap: `Ta fenêtre est déjà large (${fmtHM(s.tib)}). On la garde.`,
    };
    // en mode « avec un pro », on montre les chiffres sans proposer de resserrer ni d'élargir
    const msg = out.restriction === "pro" ? `Ton sommeil a occupé ${pct}.${sleepy ? " Tu as signalé de la somnolence : parles-en vite avec ton/ta professionnel·le." : ""}` : TEXT[s.status];
    result.appendChild(el(`<div class="card solid mt"><p class="small">${esc(msg)}</p></div>`));
    const logExtra = { se: s.meanSE, n: s.n, sleepy };
    const keep = () => {
      state.windowLog.push({ date: today, kind:"keep", bed: w.bed, wake: w.wake, setBy: w.setBy, ...logExtra });
      save(); toast("C'est noté. Prochain bilan dans une semaine."); rerender();
    };
    if (out.restriction === "pro") {
      result.appendChild(el(`<p class="small muted mt">Avec ce que tu as indiqué au départ, les changements de fenêtre se décident avec ton/ta professionnel·le : montre-lui ce bilan.</p>`));
      const ok = el(`<button class="btn primary block mt">C'est noté</button>`); ok.onclick = keep; result.appendChild(ok);
      return;
    }
    if (s.status === "up" || s.status === "down") {
      if (state.profile.accompanied) result.appendChild(el(`<p class="tiny muted mt">C'est une proposition : si tu as convenu d'autre chose en séance, c'est ce qui compte.</p>`));
      const apply = el(`<button class="btn primary block mt">Coucher à ${s.newBed} à partir de ce soir</button>`);
      apply.onclick = () => {
        setWindow({ bed: s.newBed, wake: w.wake, setBy: "bilan" }, "adjust", logExtra);
        toast("Fenêtre ajustée"); rerender();
      };
      const k = el(`<button class="btn ghost block mt">Garder ma fenêtre actuelle</button>`); k.onclick = keep;
      result.appendChild(apply); result.appendChild(k);
    } else {
      const ok = el(`<button class="btn primary block mt">D'accord</button>`); ok.onclick = keep; result.appendChild(ok);
    }
  }
  return c;
}

function buildAgendaCard(today) {
  const card = el(`<div class="card"><div class="card-title">Mon agenda du sommeil</div></div>`);
  const nights = state.journal.filter(e => e.date > addDays(today, -14) && e.date <= today);
  if (!nights.length) {
    card.appendChild(el(`<p class="small muted">Aucune nuit notée ces deux dernières semaines.</p>`));
  } else {
    card.appendChild(agendaChart(today));
    [...nights].reverse().forEach(e => {
      const c = computeNight(e);
      const row = el(`<button class="list-entry night-row" style="display:block;width:100%;text-align:left">
        <div class="row between"><span class="date">${frDate(e.date)}</span><span class="tiny muted">${esc(QUALITY_LABELS[e.quality-1] || "")}</span></div>
        <div class="small muted">${e.bed} → ${e.rise} · sommeil estimé ${fmtHM(c.tst)} sur ${fmtHM(c.tib)}</div></button>`);
      row.onclick = () => navigate("nuit", e.date);

  return card;
}

/* Barres : temps au lit (clair) et sommeil estimé (plein), 14 derniers jours. Neutre :
   pas de couleur « bonne » ou « mauvaise » nuit. */
function agendaChart(today) {
  const W = 320, H = 140, P = 18, days = 14, maxMin = 600;
  const bw = (W - P*2) / days - 4;
  const y = m => H - P - (H - P*2) * Math.min(maxMin, m) / maxMin;
  let bars = "";
  for (let i = 0; i < days; i++) {
    const d = addDays(today, i - days + 1);
    const e = state.journal.find(x => x.date === d);
    const x = P + i * ((W - P*2) / days) + 2;
    if (e) {
      const c = computeNight(e);
      bars += `<rect x="${x.toFixed(1)}" y="${y(c.tib).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-P-y(c.tib)).toFixed(1)}" rx="3" fill="var(--color-primary)" opacity="0.22"/>`;
      bars += `<rect x="${x.toFixed(1)}" y="${y(c.tst).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-P-y(c.tst)).toFixed(1)}" rx="3" fill="var(--color-primary)" opacity="0.85"/>`;
    }
    if (i % 2 === 1 || i === days - 1) bars += `<text x="${(x + bw/2).toFixed(1)}" y="${H - 4}" fill="var(--color-muted)" font-size="8" text-anchor="middle">${parseYmd(d).getDate()}</text>`;
  }
  const svg = el(`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Temps au lit et sommeil estimé sur 14 jours">${bars}</svg>`);
  const box = el(`<div style="margin-bottom:.8rem"></div>`);
  box.appendChild(svg);
  box.appendChild(el(`<div class="legend"><span><i style="background:var(--color-primary);opacity:.3"></i>Temps au lit</span><span><i style="background:var(--color-primary)"></i>Sommeil estimé</span></div>`));
  return box;
}

async function shareAgenda() {
  const text = agendaText(state.journal, state.window, ymd());
  try {
    if (navigator.share) { await navigator.share({ title: "Mon agenda du sommeil", text }); return; }
  } catch(e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("Récap copié : tu peux le coller dans un message"); return; } catch(e) {}
  const body = el(`<div><h2>Mon agenda</h2><textarea readonly style="min-height:300px;font-size:.8rem">${esc(text)}</textarea></div>`);
  const close = el(`<button class="btn primary block mt">Fermer</button>`); close.onclick = closeModal; body.appendChild(close);
  openModal(body);
}

/* ---- Le moment des soucis (« constructive worry », Carney & Waters 2006) ---- */
function renderSoucis() {
  const wrap = el(`<div></div>`);
  wrap.appendChild(subhead("Le moment des soucis"));
  wrap.appendChild(el(`<div class="card solid">
    <p class="small">En fin de journée, loin du lit, prends un quart d'heure pour poser ce qui te préoccupe. Pour ce qui dépend de toi, tu notes une prochaine petite étape. Le soir venu, ces pensées ont déjà eu leur moment.</p></div>`));

  const timeCard = el(`<div class="card"><label class="field mb0"><span class="lbl">Heure de ton moment des soucis</span><input type="time" value="${esc(state.worryTime)}"></label></div>`);
  timeCard.querySelector("input").onchange = e => { state.worryTime = e.target.value; save(); Notif.reschedule(); toast("Heure enregistrée"); };
  wrap.appendChild(timeCard);

  const sess = { items: [] };
  const card = el(`<div class="card"><div class="card-title">Maintenant</div></div>`);
  const ta = el(`<label class="field"><span class="lbl">Ce qui te préoccupe en ce moment <span class="hint">(une chose par ligne)</span></span><textarea></textarea></label>`);
  card.appendChild(ta);
  const list = el(`<div></div>`);
  const next = el(`<button class="btn ghost block">Continuer →</button>`);
  next.onclick = () => {
    const lines = ta.querySelector("textarea").value.split("\n").map(s => s.trim()).filter(Boolean);
    if (!lines.length) { toast("Écris au moins une chose"); return; }
    sess.items = lines.map(text => ({ text, cat:null, step:"" }));
    next.hidden = true; ta.hidden = true;
    renderItems();
  };
  card.appendChild(next);
  card.appendChild(list);
  wrap.appendChild(card);

  function renderItems() {
    list.innerHTML = "";
    sess.items.forEach(it => {
      const box = el(`<div class="list-entry"><p class="small"><strong>${esc(it.text)}</strong></p></div>`);
      const detail = el(`<div class="mt"></div>`);
      box.appendChild(choiceField("", ["Je peux faire quelque chose", "Ça ne dépend pas de moi pour l'instant"],
        it.cat === "act" ? "Je peux faire quelque chose" : it.cat === "no" ? "Ça ne dépend pas de moi pour l'instant" : null,
        v => { it.cat = v.startsWith("Je peux") ? "act" : "no"; showDetail(); check(); }, true));
      box.appendChild(detail);
      function showDetail() {
        detail.innerHTML = "";
        if (it.cat === "act") {
          const s = el(`<label class="field mb0"><span class="lbl small">Prochaine petite étape <span class="hint">(facultatif)</span></span><input type="text" maxlength="120" placeholder="Ex. : appeler demain à 10 h" value="${esc(it.step)}"></label>`);
          s.querySelector("input").oninput = e => it.step = e.target.value;
          detail.appendChild(s);
        } else if (it.cat === "no") {
          detail.appendChild(el(`<p class="tiny muted">Elle a eu son moment aujourd'hui. Si elle revient ce soir, tu peux te le rappeler et la laisser passer.</p>`));
        }
      }
      showDetail();
      list.appendChild(box);
    });
    const done = el(`<button class="btn primary block mt" disabled>Refermer le carnet</button>`);
    list.appendChild(done);
    function check() { done.disabled = !sess.items.every(i => i.cat); }
    check();
    done.onclick = () => {
      state.worry.push({ date: ymd(), items: sess.items.map(i => ({ text:i.text, cat:i.cat, step:i.step.trim() })) });
      if (state.worry.length > 120) state.worry = state.worry.slice(-120);
      save(); toast("Carnet refermé pour aujourd'hui"); rerender();
    };
  }

  const steps = state.worry.slice(-6).reverse().flatMap(s => s.items.filter(i => i.cat === "act" && i.step).map(i => ({ ...i, date: s.date })));
  if (steps.length) {
    const c = el(`<div class="card"><div class="card-title">Mes prochaines étapes</div></div>`);
    steps.slice(0, 8).forEach(i => c.appendChild(el(`<div class="list-entry"><div class="date">${frDate(i.date)} · ${esc(i.text)}</div><div class="small">→ ${esc(i.step)}</div></div>`)));
    wrap.appendChild(c);
  }
  return wrap;
}

  appearance.appendChild(toggleRow("Mode nuit auto (21h-7h)", state.nightModeAuto, v=>{ state.nightModeAuto=v; save(); applyNightMode(); }));
  wrap.appendChild(appearance);

  const rem = el(`<div class="card"><div class="card-title">Rappels</div></div>`);
  const notifToggle = (label, key) => toggleRow(label, state.reminders[key], async v=>{
    if (v && !await Notif.ensure()) { toast("Autorise les notifications"); return false; }
    state.reminders[key] = v; save(); Notif.reschedule();
  });
  rem.appendChild(notifToggle(`Noter ma nuit (${NOTIF_DEFS[0].time()})`, "journal"));
  rem.appendChild(notifToggle(`Le moment des soucis (${state.worryTime})`, "worry"));
  rem.appendChild(notifToggle("Début de ma fenêtre (30 min avant)", "bedtime"));
  wrap.appendChild(rem);

  if (HealthSync.available()) {
    const health = el(`<div class="card"><div class="card-title">Synchro santé</div></div>`);
    health.appendChild(toggleRow("Apple Santé / Health Connect", state.healthSync, async v=>{
      if (v && !await HealthSync.ensure()) { toast("Autorise l'accès aux données de sommeil"); return false; }
      state.healthSync = v; save();
    }));
    health.appendChild(el(`<p class="tiny muted" style="padding:.3rem 0 0">Pré-remplit le coucher et le dernier réveil dans ton agenda. Tu gardes la main sur tout le reste.</p>`));
    wrap.appendChild(health);
  }

  const follow = el(`<div class="card"><div class="card-title">Mon accompagnement</div></div>`);
  follow.appendChild(toggleRow("Je suis suivi·e par un·e professionnel·le pour mon sommeil", !!state.profile.accompanied, v=>{ state.profile.accompanied = v; save(); }));
  const redo = el(`<button class="btn ghost block mt">Refaire le questionnaire de départ</button>`);
  redo.onclick = () => startOnboarding(true);
  follow.appendChild(redo);
  wrap.appendChild(follow);

  wrap.appendChild(helpCard());

  const data = el(`<div class="card"><div class="card-title">Données</div><p class="small muted">Tout reste sur ton appareil : rien n'est transmis à nos serveurs ni à des tiers.</p></div>`);
  const tools = el(`<div class="row mt"><button class="btn ghost grow">⬇️ Exporter</button><button class="btn ghost grow">↺ Tout effacer</button></div>`);
  tools.children[0].onclick = exportJSON;
  tools.children[1].onclick = ()=>{ if(confirm("Effacer toutes tes données (agenda compris) et recommencer ?")){ localStorage.removeItem(LS_KEY); location.reload(); } };
  data.appendChild(tools);
  const about = el(`<p class="tiny muted center" style="margin-top:.9rem"><button class="tiny" style="color:var(--color-primary);text-decoration:underline">Politique de confidentialité</button> · v${APP_VERSION} · AGPL-3.0</p>`);
  about.querySelector("button").onclick = openPrivacy;
  data.appendChild(about);
  wrap.appendChild(data);
  return wrap;
}

function helpCard() {
  return el(`<div class="card help-card"><div class="card-title">Besoin d'aide</div>
    <p class="small">Si tes pensées deviennent très sombres : <a href="tel:3114">3114</a>, numéro national de prévention du suicide, gratuit, 24 h/24.</p>
    <p class="small mt">Urgence : <a href="tel:15">15</a> ou <a href="tel:112">112</a>.</p>
    <p class="tiny muted mt">Serein Sommeil est un compagnon : il ne remplace ni ton/ta psy, ni ton médecin.</p></div>`);
}

async function openPrivacy() {
  try {
    const res = await fetch("privacy.html");
    if (!res.ok) throw new Error(res.status);
    const doc = new DOMParser().parseFromString(await res.text(), "text/html");
    const main = document.importNode(doc.querySelector("main"), true);
    const body = el(`<div></div>`);
    body.appendChild(main);
    const close = el(`<button class="btn primary block mt">Fermer</button>`); close.onclick = closeModal;
    body.appendChild(close);
    openModal(body);
  } catch(e) { toast("Politique de confidentialité consultable sur sereinapp.fr"); }
}

function toggleRow(label, val, onChange) {
  const row = el(`<div class="row between" style="padding:.7rem 0;border-bottom:1px solid var(--color-border)"><span class="small">${esc(label)}</span></div>`);
  const sw = el(`<button class="check-box" style="width:46px;height:26px;border-radius:13px;border:none;flex-shrink:0;background:${val?"var(--color-primary)":"var(--color-surface-2)"};position:relative;transition:.2s"><span style="position:absolute;top:3px;left:${val?23:3}px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s"></span></button>`);
  sw.setAttribute("role","switch"); sw.setAttribute("aria-checked",val); sw.setAttribute("aria-label",label);
  sw.onclick = async ()=>{
    const nv = sw.getAttribute("aria-checked")!=="true";
    const res = await onChange(nv);
    if (res===false) return;
    sw.setAttribute("aria-checked",nv);
    sw.style.background = nv?"var(--color-primary)":"var(--color-surface-2)";
    sw.firstElementChild.style.left = nv?"23px":"3px";
  };
  row.appendChild(sw);
  return row;
}

/* ---------- Relaxation ---------- */
/* Voix guidées Serein (méditation), streamées depuis le CDN public de l'app Serein -
   trop volumineuses (6-14 Mo) pour ce fichier unique. Nécessite une connexion ; le guide
   visuel reste utilisable hors-ligne. */
const AUDIO_CDN = "https://audio.sereinapp.fr/masculin/";
function audioPlayerCard(file, label, minutes) {
  const url = AUDIO_CDN + encodeURIComponent(file);
  const card = el(`<div class="card solid mt">
    <strong class="small">🎧 ${esc(label)} (${minutes} min)</strong>
    <audio controls preload="none" style="width:100%;margin-top:.6rem" src="${url}"></audio>
    <p class="tiny muted mt">Voix guidée Serein - nécessite une connexion internet</p>
  </div>`);
  card.querySelector("audio").onerror = ()=>toast("Audio indisponible - vérifie ta connexion");
  return card;
}

function openBreathSlow() {
  const body = el(`<div class="center"><h2>Respiration lente</h2>
    <p class="small muted">Inspire 5 secondes, retiens 1 seconde, expire 8 secondes. Une expiration plus longue que l'inspiration est une façon simple de ralentir. Si c'est inconfortable, reviens à ton rythme naturel.</p>
    <div class="breath-stage"><div class="breath-circle">Prêt·e ?</div></div></div>`);
  const circle = body.querySelector(".breath-circle");
  let stop=false;
  const phases=[["Inspire",5000,1.5],["Retiens",1000,1.5],["Expire",8000,1]];
  async function loop(){ while(!stop){ for(const [label,dur,scale] of phases){ if(stop)return; circle.textContent=label; circle.style.transition=`transform ${dur}ms var(--ease)`; circle.style.transform=`scale(${scale})`; await wait(dur); } } }
  const ctrl = el(`<button class="btn primary block mt">Commencer</button>`);
  let running=false;
  ctrl.onclick=()=>{ if(!running){ running=true; stop=false; ctrl.textContent="Arrêter"; loop(); } else { stop=true; running=false; ctrl.textContent="Commencer"; circle.style.transform="scale(1)"; circle.textContent="Prêt·e ?"; } };
  body.appendChild(ctrl);
  body.appendChild(audioPlayerCard("Respiration 4-7-8 — Calme profond.mp3", "Version audio guidée, sur un autre rythme (4-7-8)", 6));
  const close=el(`<button class="btn ghost block mt">Fermer</button>`); close.onclick=closeModal; body.appendChild(close);
  openModal(body);
  onModalClose(()=>{ stop = true; });
}
function openBreathBelly() {
  const body = el(`<div class="center"><h2>Respiration du ventre</h2>
    <p class="small muted">Une main sur le ventre. Le cercle se gonfle, ton ventre aussi. Le cercle se dégonfle, tu souffles lentement.</p>
    <div class="breath-stage"><div class="breath-circle" style="border-radius:50%">Suis le cercle</div></div></div>`);
  const circle=body.querySelector(".breath-circle"); let stop=false;
  async function loop(){ while(!stop){ circle.textContent="Gonfle"; circle.style.transition="transform 4000ms var(--ease)"; circle.style.transform="scale(1.5)"; await wait(4000); if(stop)break; circle.textContent="Souffle"; circle.style.transform="scale(1)"; await wait(6000);} }
  const ctrl=el(`<button class="btn primary block mt">Commencer</button>`); let running=false;
  ctrl.onclick=()=>{ if(!running){running=true;stop=false;ctrl.textContent="Arrêter";loop();}else{stop=true;running=false;ctrl.textContent="Commencer";circle.style.transform="scale(1)";} };
  body.appendChild(ctrl);
  const close=el(`<button class="btn ghost block mt">Fermer</button>`); close.onclick=closeModal; body.appendChild(close);

function openBodyScan() {
  const zones=["les orteils","les pieds","les mollets","les genoux","les cuisses","les hanches","le ventre","le dos","les mains","les bras","les épaules","le cou","le visage"];
  const body=el(`<div class="center"><h2>Body scan</h2>
    <p class="small muted">Tu pars des orteils. Pour chaque zone, tu remarques simplement ce qui est là, et tu laisses relâcher si ça vient.</p>
    <div class="card solid mt"><div class="body-zone">Prêt·e ?</div><div class="tiny muted mt">10 secondes par zone</div></div></div>`);
  const zone=body.querySelector(".body-zone"); let stop=false;
  async function run(){ for(let i=0;i<zones.length;i++){ if(stop)return; zone.style.opacity=0; await wait(300); zone.textContent="Remarque "+zones[i]; zone.style.opacity=1; await wait(9700);} if(!stop) zone.textContent="Fin du parcours 🌙"; }
  const ctrl=el(`<button class="btn primary block mt">Commencer</button>`); let running=false;
  ctrl.onclick=()=>{ if(!running){running=true;stop=false;ctrl.textContent="Arrêter";run();}else{stop=true;running=false;ctrl.textContent="Commencer";} };
  body.appendChild(ctrl);
  body.appendChild(audioPlayerCard("Le scan corporel.mp3", "Version audio guidée", 10));
  const close=el(`<button class="btn ghost block mt">Fermer</button>`); close.onclick=closeModal; body.appendChild(close);
  openModal(body);
  onModalClose(()=>{ stop = true; });
}
function openWalk() {

    <div class="card solid mt"><p>Choisis une promenade que tu connais par cœur.</p>
    <p class="small muted mt">Comment tu es habillé·e. Ta façon de marcher. Les sons, les immeubles, les gens qui passent. Chaque détail.</p>

const wait = ms => new Promise(r=>setTimeout(r,ms));

/* ---------- SOS nuit ---------- */
/* Volontairement minimal : pas de minuteur, pas de notification, rien qui pousse à
   regarder l'heure ou à garder le téléphone en main. */
function openSOS() {
  const body = el(`<div><h2>Tu n'arrives pas à dormir</h2>
    <p class="small muted mt">Inutile de lutter dans le lit.</p>
    <div class="card solid mt"><ol class="sos-steps small">
      <li>Lève-toi et va dans une autre pièce, lumière douce.</li>
      <li>Fais quelque chose de calme : un livre papier, de la musique douce.</li>
      <li>Reviens te coucher quand tu sens le sommeil revenir. Pas besoin de regarder l'heure.</li>
      <li>Si ça recommence, refais pareil. Demain, lève-toi à ton heure habituelle.</li>
    </ol></div>
    <p class="small mt"><strong>Tu peux poser ton téléphone maintenant.</strong></p></div>`);
  body.appendChild(el(`<p class="tiny muted mt">Si tes pensées deviennent très sombres : <a href="tel:3114" style="color:var(--color-primary)">3114</a> (24 h/24, gratuit). Urgence : <a href="tel:15" style="color:var(--color-primary)">15</a> ou <a href="tel:112" style="color:var(--color-primary)">112</a>.</p>`));
  const close = el(`<button class="btn primary block mt">Fermer</button>`); close.onclick = closeModal; body.appendChild(close);
  openModal(body);
